# Mutation testing of the Worker and the CLI (Stryker).
#
# Runs once a week and on demand, not on every push: its value is not blocking a merge but
# warning that the tests verify less than before. Locally it is the same as `make mutation`.
#
# It only fails if a package's global score drops more than 1 point below its
# `<package>/mutation-baseline.json`. If the drop is intentional, update it in a PR with
# `make mutation-baseline`.
name: Mutation testing

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: mutation
  cancel-in-progress: true

jobs:
  stryker:
    name: Stryker (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [worker, cli]
    steps:
      - uses: actions/checkout@v4

      # No `version`: uses the one in `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      # The CLI needs Node >= 22.18 to run TypeScript without compiling it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # If the suite is not green, the score means nothing.
      - name: Tests
        run: pnpm --dir ${{ matrix.package }} test

      - name: Mutation testing
        run: pnpm --dir ${{ matrix.package }} run test:mutation

      - name: Compare with the baseline
        # shell: bash turns on pipefail; without it, tee's exit 0 hides the script's exit 1.
        shell: bash
        run: node scripts/mutation-score.mjs ${{ matrix.package }} | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ matrix.package }}
          path: ${{ matrix.package }}/reports/mutation/
          retention-days: 30
