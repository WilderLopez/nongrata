openapi: 3.1.0
info:
  title: NonGrata admin API
  version: v1
  summary: Ban, unban and inspect devices and Apple accounts of one app's NonGrata Worker.
  description: |
    The admin endpoints of a NonGrata Worker (`/v1/admin/*`) and the claim of a pairing
    (`/v1/pair/claim`). The guide is [docs/ADMIN-API.md](ADMIN-API.md); the design, in section
    6.4 of docs/DESIGN.md; admin devices, in [docs/DEVICE-PAIRING.md](DEVICE-PAIRING.md).

    - Every request to `/v1/admin/*` carries either `Authorization: Bearer <ADMIN_TOKEN>` or the
      four `NonGrata-*` headers of a paired admin device (`deviceSignature`), never both (`400
      ambiguous credentials`). Without valid credentials any `/v1/admin/*` path answers `401`
      before anything else, even an unknown one. A route the caller's role does not allow
      answers `403`.
    - Every ban, lookup and listing endpoint requires `app`, and the app must be configured in
      that Worker (`HASH_PREFIX_<APP>`); otherwise `400 invalid app` or `400 app not
      configured`. The device, app and pairing endpoints concern the whole Worker and take no
      `app`.
    - The Worker only stores and returns hashes (SHA-256 of `prefix:kind:value`) and support
      codes (`ref`): never raw identifiers or IPs. A raw `value` sent to `ban`, `unban` or
      `lookup` is hashed with the app's prefix and not kept.
    - Timestamps are Unix milliseconds. Responses are JSON with `cache-control: no-store`.
    - Listings (`bans`, `checks`, `log`) go newest first, `limit` items per page (1 to 100,
      50 by default), with keyset pagination: pass the `next_cursor` of a page as `cursor` to
      get the next one; it is `null` on the last page. Cursors are opaque.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://nongrata-{app}.{subdomain}.workers.dev
    description: One Worker deployment per app.
    variables:
      app:
        default: myapp
      subdomain:
        default: your-subdomain
  - url: http://localhost:8787
    description: wrangler dev
security:
  - adminToken: []
  - deviceSignature: []
tags:
  - name: actions
    description: Change the ban list. Every successful call is recorded in the admin log.
  - name: inspection
    description: Read-only.
  - name: devices
    description: |
      Admin devices: pairing (token only), the device's own identity, the device list and
      revocation. See docs/DEVICE-PAIRING.md.

paths:
  /v1/admin/ban:
    post:
      tags: [actions]
      operationId: ban
      summary: Ban an identifier
      description: |
        Adds the hash as a `manual` ban, or turns an existing `propagated` one into `manual`
        (with the new note and time). With `value`, the Worker hashes it with the app's prefix.
        The ban and its admin log entry are written in one transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/BanByValue"
                - $ref: "#/components/schemas/BanByHash"
            examples:
              byValue:
                value: { app: myapp, kind: idfv, value: E621E1F8-C36C-495A-93FC-0C247A3E6E5F, note: spam }
              byHash:
                value: { app: myapp, kind: icloud, hash: 3f0c2a6d8e1b4c7f9a2d5e8b1c4f7a0d3e6b9c2f5a8d1e4b7c0f3a6d9e2b5c8f }
      responses:
        "200":
          description: Banned.
          content:
            application/json:
              schema:
                type: object
                required: [app, kind, hash]
                properties:
                  app: { $ref: "#/components/schemas/App" }
                  kind: { $ref: "#/components/schemas/Kind" }
                  hash: { $ref: "#/components/schemas/Hash" }
              example: { app: myapp, kind: idfv, hash: 9d2c5f8a1b4e7d0c3f6a9b2e5d8c1f4a7b0e3d6c9f2a5b8e1d4c7f0a3b6e9d2c }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: |
            `invalid app`, `app not configured`, `missing value or hash`, `invalid kind`,
            `invalid hash`, `invalid value`; `ambiguous credentials`.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/unban:
    post:
      tags: [actions]
      operationId: unban
      summary: Unban a hash, a device (by ref), or both
      description: |
        - `{ app, kind, value | hash }` deletes that hash from the list (`removed` says whether it
          was there).
        - `{ app, ref }` deletes at once the automatic (`propagated`) bans that device added and
          schedules its full unban: on its next check the Worker sets `bit0` to false and deletes
          the hashes the check carries, except manual bans made after the unban was scheduled.

        Both can go in one request. Every successful call is recorded in the admin log, also
        when `removed` is false.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnbanRequest"
            examples:
              byRef:
                value: { app: myapp, ref: 7F3A9C21 }
              byValue:
                value: { app: myapp, kind: user, value: u-1234 }
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                type: object
                required: [app]
                properties:
                  app: { $ref: "#/components/schemas/App" }
                  hash:
                    $ref: "#/components/schemas/Hash"
                    description: Present when a hash was given.
                  removed:
                    type: boolean
                    description: Present when a hash was given. Whether it was in the list.
                  ref:
                    $ref: "#/components/schemas/Ref"
                    description: Present when a ref was given.
                  unban_scheduled:
                    const: true
                    description: Present when a ref was given.
              examples:
                byRef:
                  value: { app: myapp, ref: 7F3A9C21, unban_scheduled: true }
                byHash:
                  value: { app: myapp, hash: 9d2c5f8a1b4e7d0c3f6a9b2e5d8c1f4a7b0e3d6c9f2a5b8e1d4c7f0a3b6e9d2c, removed: true }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: |
            `invalid app`, `app not configured`, `missing value, hash or ref`, `invalid kind`,
            `invalid hash`, `invalid value`, `invalid ref`; `ambiguous credentials`.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/lookup:
    get:
      tags: [inspection]
      operationId: lookup
      summary: What is known about a ref or a hash
      description: |
        With `ref`: the pending or consumed unban of that device and its last 20 checks. With
        `kind` and `value` or `hash`: the ban row, or `null`. `ref` wins if both are given.
      parameters:
        - $ref: "#/components/parameters/app"
        - name: ref
          in: query
          schema: { $ref: "#/components/schemas/Ref" }
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/Kind" }
        - name: value
          in: query
          description: Raw identifier; hashed with the app's prefix and not kept.
          schema: { type: string, minLength: 1 }
        - name: hash
          in: query
          schema: { $ref: "#/components/schemas/Hash" }
      responses:
        "200":
          description: Found or not (`unban` or `banned` is `null` when there is nothing).
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    title: By ref
                    required: [app, ref, unban, checks]
                    properties:
                      app: { $ref: "#/components/schemas/App" }
                      ref: { $ref: "#/components/schemas/Ref" }
                      unban:
                        oneOf:
                          - type: "null"
                          - type: object
                            required: [created_at, consumed_at]
                            properties:
                              created_at: { $ref: "#/components/schemas/Millis" }
                              consumed_at:
                                oneOf:
                                  - $ref: "#/components/schemas/Millis"
                                  - type: "null"
                      checks:
                        type: array
                        maxItems: 20
                        items:
                          type: object
                          required: [blocked, matched, bit0, intent, created_at]
                          properties:
                            blocked: { $ref: "#/components/schemas/Flag" }
                            matched: { $ref: "#/components/schemas/Flag" }
                            bit0: { $ref: "#/components/schemas/NullableFlag" }
                            intent: { type: [string, "null"] }
                            created_at: { $ref: "#/components/schemas/Millis" }
                  - type: object
                    title: By hash
                    required: [app, hash, banned]
                    properties:
                      app: { $ref: "#/components/schemas/App" }
                      hash: { $ref: "#/components/schemas/Hash" }
                      banned:
                        oneOf:
                          - type: "null"
                          - allOf:
                              - $ref: "#/components/schemas/Ban"
                              - type: object
                                required: [app]
                                properties:
                                  app: { $ref: "#/components/schemas/App" }
              examples:
                byRef:
                  value:
                    app: myapp
                    ref: 7F3A9C21
                    unban: { created_at: 1762790400000, consumed_at: null }
                    checks:
                      - { blocked: 1, matched: 1, bit0: 1, intent: launch, created_at: 1762786800000 }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: |
            `invalid app`, `app not configured`, `invalid ref`, `missing ref, value or hash`,
            `invalid kind`, `invalid hash`, `invalid value`.
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/admin/bans:
    get:
      tags: [inspection]
      operationId: listBans
      summary: List the banned hashes
      description: |
        Newest first (by `created_at`, then by `hash`). A ban that becomes `manual` again takes
        the time of that new ban. Unbanned hashes are deleted, so they are not listed; the admin
        log keeps the record.
      parameters:
        - $ref: "#/components/parameters/app"
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/Kind" }
        - name: reason
          in: query
          schema: { $ref: "#/components/schemas/Reason" }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Ban" }
              example:
                app: myapp
                items:
                  - hash: 9d2c5f8a1b4e7d0c3f6a9b2e5d8c1f4a7b0e3d6c9f2a5b8e1d4c7f0a3b6e9d2c
                    kind: idfv
                    reason: manual
                    note: spam
                    created_at: 1762790400000
                next_cursor: MTc2Mjc5MDQwMDAwMC45ZDJjNWY4YTFiNGU3ZDBjM2Y2YTliMmU1ZDhjMWY0YTdiMGUzZDZjOWYyYTViOGUxZDRjN2YwYTNiNmU5ZDJj
        "400":
          $ref: "#/components/responses/BadRequest"
          description: |
            `invalid app`, `app not configured`, `invalid kind`, `invalid reason`,
            `invalid limit`, `invalid cursor`.
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/admin/checks:
    get:
      tags: [inspection]
      operationId: listChecks
      summary: List recent checks
      description: |
        The `check_log`: one row per `POST /v1/device/check`, with the result only. Newest first.
        The daily cron deletes rows older than 30 days, so this covers the last 30 days at most.
        In observation mode (`ENFORCE_<APP>` off), `blocked` is what would have been blocked.
      parameters:
        - $ref: "#/components/parameters/app"
        - name: ref
          in: query
          description: Only the checks of this device.
          schema: { $ref: "#/components/schemas/Ref" }
        - name: blocked
          in: query
          schema: { type: string, enum: ["0", "1"] }
        - name: since
          in: query
          description: Only checks at or after this time (Unix ms, inclusive).
          schema: { type: string, pattern: "^[0-9]+$" }
          example: "1762704000000"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Check" }
              example:
                app: myapp
                items:
                  - { ref: 7F3A9C21, blocked: 1, matched: 0, bit0: 1, intent: launch, created_at: 1762786800000 }
                  - { ref: 0B4E6D12, blocked: 0, matched: 0, bit0: null, intent: signup, created_at: 1762786200000 }
                next_cursor: null
        "400":
          $ref: "#/components/responses/BadRequest"
          description: |
            `invalid app`, `app not configured`, `invalid ref`, `invalid blocked`,
            `invalid since`, `invalid limit`, `invalid cursor`.
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/admin/log:
    get:
      tags: [inspection]
      operationId: listAdminLog
      summary: List the admin actions
      description: |
        With `app`: one entry per successful `ban` or `unban` of that app, newest first. Without
        `app`: the Worker-wide device events, `pair` (an approved device) and `revoke`, with the
        same pagination and `app: null` in the page. A present but bad `app` is still `invalid
        app` or `app not configured`. It stores what those endpoints store (hash, ref, note),
        never a raw `value`, and who acted (`actor`). It is not purged: bans do not expire, and
        neither does the record of who was banned or unbanned and why. Unbans by `ref` record
        when they were scheduled; when a device consumes one shows in `lookup` by `ref`.
      parameters:
        - name: app
          in: query
          description: Omit it for the Worker's device events.
          schema: { $ref: "#/components/schemas/App" }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      app:
                        oneOf:
                          - $ref: "#/components/schemas/App"
                          - type: "null"
                        description: "`null` for the Worker's device events."
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/LogEntry" }
              examples:
                app:
                  value:
                    app: myapp
                    items:
                      - { action: unban, kind: null, hash: null, ref: 7F3A9C21, note: null, device_id: null, actor: "device:7sKpQ2mN4vX8yL1zR6tBcA", created_at: 1762790400000 }
                      - { action: ban, kind: idfv, hash: 9d2c5f8a1b4e7d0c3f6a9b2e5d8c1f4a7b0e3d6c9f2a5b8e1d4c7f0a3b6e9d2c, ref: null, note: spam, device_id: null, actor: null, created_at: 1762700000000 }
                    next_cursor: null
                devices:
                  value:
                    app: null
                    items:
                      - { action: revoke, kind: null, hash: null, ref: null, note: null, device_id: 7sKpQ2mN4vX8yL1zR6tBcA, actor: token, created_at: 1762791000000 }
                      - { action: pair, kind: null, hash: null, ref: null, note: "Ana's iPhone", device_id: 7sKpQ2mN4vX8yL1zR6tBcA, actor: token, created_at: 1762786000000 }
                    next_cursor: null
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "`invalid app`, `app not configured`, `invalid limit`, `invalid cursor`."
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/admin/apps:
    get:
      tags: [inspection]
      operationId: listApps
      summary: The apps configured in this Worker
      description: |
        Every app with a `HASH_PREFIX_<APP>`, sorted. The Worker only sees the variable's
        suffix, so `app` is that suffix in lowercase (an app id with `-` shows with `_`).
        Nothing secret.
      responses:
        "200":
          description: The apps.
          content:
            application/json:
              schema:
                type: object
                required: [apps]
                properties:
                  apps:
                    type: array
                    items:
                      type: object
                      required: [app, enforce, devicecheck]
                      properties:
                        app: { $ref: "#/components/schemas/App" }
                        enforce: { type: boolean, description: "`ENFORCE_<APP>` is `true` (otherwise observation mode)." }
                        devicecheck: { type: boolean, description: The Apple DeviceCheck key is set. }
              example: { apps: [{ app: myapp, enforce: true, devicecheck: true }] }
        "400": { $ref: "#/components/responses/AmbiguousCredentials" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/admin/me:
    get:
      tags: [devices]
      operationId: me
      summary: The calling device
      description: |
        Devices only (the token gets `403`). A pending device may call this, and only this
        (anything else gives it `403`), while its pairing lives: it tells it when it has been
        approved. Once the pairing is cancelled or expires, it gets `401` and should delete its
        key.
      security:
        - deviceSignature: []
      responses:
        "200":
          description: The device.
          content:
            application/json:
              schema:
                type: object
                required: [device_id, name, platform, role, status, created_at]
                properties:
                  device_id: { $ref: "#/components/schemas/DeviceId" }
                  name: { type: string }
                  platform: { $ref: "#/components/schemas/Platform" }
                  role: { $ref: "#/components/schemas/Role" }
                  status: { type: string, enum: [pending, active] }
                  created_at: { $ref: "#/components/schemas/Millis" }
        "400": { $ref: "#/components/responses/AmbiguousCredentials" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: List the admin devices
      description: Every device, newest first, pending and revoked ones included. Never the public key. Token or an `admin` device.
      responses:
        "200":
          description: The devices.
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items: { $ref: "#/components/schemas/Device" }
        "400": { $ref: "#/components/responses/AmbiguousCredentials" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/devices/{id}/revoke:
    post:
      tags: [devices]
      operationId: revokeDevice
      summary: Revoke a device
      description: |
        Permanent: from its next request the device gets `401`; to use it again, pair it again.
        The token or an `admin` device may revoke any device; any active device may revoke
        itself. Idempotent: revoking again answers the original `revoked_at` and writes nothing.
        Recorded once in the admin log as `revoke`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/DeviceId" }
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                type: object
                required: [device_id, revoked_at]
                properties:
                  device_id: { $ref: "#/components/schemas/DeviceId" }
                  revoked_at: { $ref: "#/components/schemas/Millis" }
        "400": { $ref: "#/components/responses/AmbiguousCredentials" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          $ref: "#/components/responses/NotFound"
          description: "`not_found`: no such device."

  /v1/admin/pairings:
    post:
      tags: [devices]
      operationId: createPairing
      summary: Create a pairing for a new admin device
      description: |
        Token only. A one-time pairing that expires in 10 minutes. The secret is returned once;
        the Worker keeps only its SHA-256. Show `pair_url` to the device (as a QR code). The
        request must reach the Worker over https, except `http://localhost` and
        `http://127.0.0.1` (any port) for `wrangler dev`.
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/Role" }
                label:
                  type: [string, "null"]
                  minLength: 1
                  maxLength: 64
                  description: A hint for the admin, 1 to 64 UTF-16 code units; clients truncate it.
            example: { role: admin, label: "Ana's iPhone" }
      responses:
        "200":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [id, secret, role, expires_at, pair_url]
                properties:
                  id: { $ref: "#/components/schemas/PairingId" }
                  secret: { type: string, pattern: "^[A-Za-z0-9_-]{43}$", description: 32 random bytes, base64url. }
                  role: { $ref: "#/components/schemas/Role" }
                  expires_at: { $ref: "#/components/schemas/Millis" }
                  pair_url:
                    type: string
                    description: |
                      Exactly `nongrata://pair?v=1&url=<origin, percent-encoded>&id=<id>&secret=<secret>&role=<role>&exp=<expires_at>`.
                      `role` and `exp` are hints for the device's screen; the stored role is the one that counts.
                    example: "nongrata://pair?v=1&url=https%3A%2F%2Fnongrata-myapp.example.workers.dev&id=q3VZbVqK0n8xJ3fR2sTgWw&secret=Xk9aB3cD4eF5gH6iJ7kL8mN9oP0qR1sT2uV3wX4yZ5a&role=admin&exp=1762790000000"
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "`invalid role`, `invalid label`, `https required`."
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/pairings/{id}:
    parameters:
      - $ref: "#/components/parameters/pairingId"
    get:
      tags: [devices]
      operationId: getPairing
      summary: The state of a pairing
      description: |
        Token only. `approved` wins; otherwise `expired` after `expires_at` or once burned
        (5 failed claims); then `claimed` or `pending`. `device` is there once claimed, while the
        device exists. The CLI polls this every 2 seconds.
      security:
        - adminToken: []
      responses:
        "200":
          description: The pairing.
          content:
            application/json:
              schema:
                type: object
                required: [status, role, label, expires_at]
                properties:
                  status: { type: string, enum: [pending, claimed, approved, expired] }
                  role: { $ref: "#/components/schemas/Role" }
                  label: { type: [string, "null"] }
                  expires_at: { $ref: "#/components/schemas/Millis" }
                  device:
                    type: object
                    required: [device_id, name, platform, verification_code]
                    properties:
                      device_id: { $ref: "#/components/schemas/DeviceId" }
                      name: { type: string }
                      platform: { $ref: "#/components/schemas/Platform" }
                      verification_code: { $ref: "#/components/schemas/VerificationCode" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          $ref: "#/components/responses/NotFound"
          description: "`pairing not found`."
    delete:
      tags: [devices]
      operationId: cancelPairing
      summary: Cancel a pairing
      description: Token only. Deletes the pairing and, if it was claimed, its pending device. An approved one cannot be cancelled; revoke the device instead.
      security:
        - adminToken: []
      responses:
        "200":
          description: Cancelled.
          content:
            application/json:
              schema:
                type: object
                required: [cancelled]
                properties:
                  cancelled: { const: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          $ref: "#/components/responses/NotFound"
          description: "`pairing not found`."
        "409":
          $ref: "#/components/responses/Conflict"
          description: "`pairing already approved`."

  /v1/admin/pairings/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/pairingId"
    post:
      tags: [devices]
      operationId: approvePairing
      summary: Approve a claimed pairing
      description: |
        Token only, after comparing the verification code with the one the device shows. The
        device becomes `active`; recorded in the admin log as `pair`, with the label as note.
      security:
        - adminToken: []
      responses:
        "200":
          description: Approved.
          content:
            application/json:
              schema:
                type: object
                required: [device_id, name, platform, role, status]
                properties:
                  device_id: { $ref: "#/components/schemas/DeviceId" }
                  name: { type: string }
                  platform: { $ref: "#/components/schemas/Platform" }
                  role: { $ref: "#/components/schemas/Role" }
                  status: { const: active }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          $ref: "#/components/responses/NotFound"
          description: "`pairing not found`."
        "409":
          $ref: "#/components/responses/Conflict"
          description: "`pairing not claimed`, `pairing already approved`, `pairing expired`."

  /v1/pair/claim:
    post:
      tags: [devices]
      operationId: claimPairing
      summary: Claim a pairing (the device)
      description: |
        No credential: the pairing's secret is the credential. Rate-limited per IP. `proof` is a
        signature with the new key over `"NONGRATA-PAIR-V1\n" + id + "\n" + public_key` (the
        base64url strings as sent). The shape of `name` and `platform` is checked first and
        named (`invalid name`, `invalid platform`), without touching the pairing or counting an
        attempt. After that every failure is the same `400 invalid pairing`, and every failure on
        an existing pairing counts towards the 5 that burn it.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, secret, public_key, name, platform, proof]
              properties:
                id: { $ref: "#/components/schemas/PairingId" }
                secret: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
                public_key:
                  type: string
                  pattern: "^[A-Za-z0-9_-]{87}$"
                  description: Uncompressed P-256 point (65 bytes, 0x04 || X || Y), base64url.
                name: { type: string, minLength: 1, maxLength: 64, description: 1 to 64 UTF-16 code units; clients truncate it. }
                platform: { $ref: "#/components/schemas/Platform" }
                proof: { $ref: "#/components/schemas/Signature" }
      responses:
        "200":
          description: Claimed; the device is pending until the admin approves it.
          content:
            application/json:
              schema:
                type: object
                required: [device_id, role, verification_code]
                properties:
                  device_id: { $ref: "#/components/schemas/DeviceId" }
                  role: { $ref: "#/components/schemas/Role" }
                  verification_code: { $ref: "#/components/schemas/VerificationCode" }
              example: { device_id: 7sKpQ2mN4vX8yL1zR6tBcA, role: admin, verification_code: "123456" }
        "400":
          $ref: "#/components/responses/BadRequest"
          description: "`invalid name`, `invalid platform`; otherwise `invalid pairing`, whatever failed."
        "429":
          description: Over the rate limit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: rate_limited }

components:
  securitySchemes:
    adminToken:
      type: http
      scheme: bearer
      description: The Worker's `ADMIN_TOKEN` secret. One token per Worker, so per app.
    deviceSignature:
      type: apiKey
      in: header
      name: NonGrata-Signature
      description: |
        A paired admin device (docs/DEVICE-PAIRING.md, section 3). All base64url values are
        unpadded. Four headers instead of
        `Authorization`: `NonGrata-Device` (the device_id), `NonGrata-Timestamp` (Unix ms, within
        5 minutes of the Worker's clock), `NonGrata-Nonce` (16 random bytes, base64url, new for
        every request) and `NonGrata-Signature`: ECDSA P-256 / SHA-256, raw r || s (64 bytes),
        base64url, over the canonical string of the request (method, host, path, canonical query,
        timestamp, nonce, device and the SHA-256 of the body). Roles: `read` or `admin`.

  parameters:
    app:
      name: app
      in: query
      required: true
      schema: { $ref: "#/components/schemas/App" }
    limit:
      name: limit
      in: query
      description: Items per page.
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page. Opaque; only valid for the same listing.
      schema: { type: string }
    pairingId:
      name: id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/PairingId" }

  responses:
    BadRequest:
      description: Invalid request; `error` says why.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: app not configured }
    Unauthorized:
      description: |
        Missing or wrong bearer token, a Worker without `ADMIN_TOKEN`, or a signed request that
        fails (unknown, pending or revoked device, bad signature, replayed nonce, malformed
        headers). Only a clock more than 5 minutes off says why, with the Worker's time.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/Error"
              - $ref: "#/components/schemas/ClockError"
          examples:
            unauthorized:
              value: { error: unauthorized }
            clock:
              value: { error: unauthorized, reason: clock, server_time: 1762790400000 }
    Forbidden:
      description: |
        The caller is authenticated but its role does not allow this route: a `read` device on
        an admin route, any device on the pairing routes, a pending device on anything but `me`,
        or the token on `me`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: forbidden }
    AmbiguousCredentials:
      description: Both `Authorization` and `NonGrata-Device` were sent.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: ambiguous credentials }
    NotFound:
      description: There is no such pairing (`pairing not found`) or device (`not_found`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: not_found }
    Conflict:
      description: The pairing or device is not in a state that allows this.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: pairing expired }

  schemas:
    App:
      type: string
      pattern: "^[a-z0-9][a-z0-9_-]{0,31}$"
      example: myapp
    Kind:
      type: string
      enum: [idfv, install, icloud, user, android_id]
    Reason:
      type: string
      enum: [manual, propagated]
      description: "`manual`: banned through this API. `propagated`: added by the Worker when a blocked device carried it."
    Hash:
      type: string
      pattern: "^[0-9a-f]{64}$"
      description: SHA-256 of `prefix:kind:value`, lowercase hex.
    Ref:
      type: string
      pattern: "^[0-9A-F]{8}$"
      description: Support code; the first 8 characters, uppercased, of the device's `install` hash.
      example: 7F3A9C21
    Millis:
      type: integer
      description: Unix time in milliseconds.
      example: 1762790400000
    Flag:
      type: integer
      enum: [0, 1]
    NullableFlag:
      type: [integer, "null"]
      enum: [0, 1, null]
      description: "`null` when Apple was not asked or did not answer."
    Note:
      type: [string, "null"]
      maxLength: 500
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    ClockError:
      type: object
      required: [error, reason, server_time]
      properties:
        error: { const: unauthorized }
        reason: { const: clock }
        server_time: { $ref: "#/components/schemas/Millis" }
    Role:
      type: string
      enum: [read, admin]
      description: "`read`: everything that only reads, plus `apps` and `me`. `admin`: also ban, unban, devices and revoke."
    Platform:
      type: string
      enum: [ios, ipados, macos, other]
    PairingId:
      type: string
      pattern: "^[A-Za-z0-9_-]{22}$"
      description: 16 random bytes, base64url without padding.
    DeviceId:
      type: string
      pattern: "^[A-Za-z0-9_-]{22}$"
      description: 16 random bytes, base64url without padding.
      example: 7sKpQ2mN4vX8yL1zR6tBcA
    Signature:
      type: string
      pattern: "^[A-Za-z0-9_-]{86}$"
      description: ECDSA P-256 / SHA-256 as raw r || s (64 bytes), base64url. Not DER.
    VerificationCode:
      type: string
      pattern: "^[0-9]{6}$"
      description: The first 4 bytes of SHA-256("NONGRATA-VERIFY-V1\n" + pairing id + "\n" + public_key), big-endian, modulo 1 000 000, as 6 digits.
    Device:
      type: object
      required: [device_id, name, platform, role, status, created_at, last_used_at, revoked_at]
      properties:
        device_id: { $ref: "#/components/schemas/DeviceId" }
        name: { type: string }
        platform: { $ref: "#/components/schemas/Platform" }
        role: { $ref: "#/components/schemas/Role" }
        status: { type: string, enum: [pending, active] }
        created_at: { $ref: "#/components/schemas/Millis" }
        last_used_at:
          oneOf:
            - $ref: "#/components/schemas/Millis"
            - type: "null"
        revoked_at:
          oneOf:
            - $ref: "#/components/schemas/Millis"
            - type: "null"
    BanByValue:
      type: object
      required: [app, kind, value]
      properties:
        app: { $ref: "#/components/schemas/App" }
        kind: { $ref: "#/components/schemas/Kind" }
        value: { type: string, minLength: 1, description: Raw identifier; hashed and not kept. }
        note: { type: string, description: Truncated to 500 characters. }
    BanByHash:
      type: object
      required: [app, kind, hash]
      properties:
        app: { $ref: "#/components/schemas/App" }
        kind: { $ref: "#/components/schemas/Kind" }
        hash: { $ref: "#/components/schemas/Hash" }
        note: { type: string, description: Truncated to 500 characters. }
    UnbanRequest:
      type: object
      required: [app]
      description: A `ref`, an identifier (`kind` with `value` or `hash`), or both.
      properties:
        app: { $ref: "#/components/schemas/App" }
        ref: { $ref: "#/components/schemas/Ref" }
        kind: { $ref: "#/components/schemas/Kind" }
        value: { type: string, minLength: 1 }
        hash: { $ref: "#/components/schemas/Hash" }
    Page:
      type: object
      required: [app, items, next_cursor]
      properties:
        app: { $ref: "#/components/schemas/App" }
        items: { type: array }
        next_cursor:
          type: [string, "null"]
          description: Pass it as `cursor` for the next page; `null` on the last one.
    Ban:
      type: object
      required: [hash, kind, reason, note, created_at]
      properties:
        hash: { $ref: "#/components/schemas/Hash" }
        kind: { $ref: "#/components/schemas/Kind" }
        reason: { $ref: "#/components/schemas/Reason" }
        note: { $ref: "#/components/schemas/Note" }
        created_at: { $ref: "#/components/schemas/Millis" }
    Check:
      type: object
      required: [ref, blocked, matched, bit0, intent, created_at]
      properties:
        ref: { $ref: "#/components/schemas/Ref" }
        blocked:
          $ref: "#/components/schemas/Flag"
          description: The verdict (in observation mode, what it would have been).
        matched:
          $ref: "#/components/schemas/Flag"
          description: One of the check's hashes was in the list.
        bit0: { $ref: "#/components/schemas/NullableFlag" }
        intent:
          type: [string, "null"]
          description: launch, foreground, login or signup, as the SDK sent it.
        created_at: { $ref: "#/components/schemas/Millis" }
    LogEntry:
      type: object
      required: [action, kind, hash, ref, note, device_id, actor, created_at]
      properties:
        action: { type: string, enum: [ban, unban, pair, revoke] }
        device_id:
          description: The device of `pair` and `revoke`; `null` for `ban` and `unban`.
          oneOf:
            - $ref: "#/components/schemas/DeviceId"
            - type: "null"
        actor:
          description: Who acted. `null` in rows written before migration 0003.
          oneOf:
            - type: string
              pattern: "^(token|device:[A-Za-z0-9_-]{22})$"
            - type: "null"
        kind:
          oneOf:
            - $ref: "#/components/schemas/Kind"
            - type: "null"
        hash:
          oneOf:
            - $ref: "#/components/schemas/Hash"
            - type: "null"
        ref:
          oneOf:
            - $ref: "#/components/schemas/Ref"
            - type: "null"
        note: { $ref: "#/components/schemas/Note" }
        created_at: { $ref: "#/components/schemas/Millis" }
