packages:
  - worker
  - cli

# Supply chain. Install scripts only run if they are approved here, package by package; any
# other one makes the install fail (strictDepBuilds, on by default).
allowBuilds:
  esbuild: true   # downloads its native binary
  workerd: true   # Workers runtime for wrangler and the tests
  fsevents: false # optional, only file watching on macOS

# Do not install versions published less than a day ago (in minutes). Because it is set
# explicitly, resolution fails instead of falling back to a younger version.
minimumReleaseAge: 1440

# Fail if a new version of a package comes with weaker provenance guarantees than earlier ones.
trustPolicy: no-downgrade
